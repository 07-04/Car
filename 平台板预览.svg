<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 660" font-family="sans-serif">
  <rect width="320" height="660" fill="#f5f5f5"/>

  <!-- 标题 -->
  <text x="160" y="30" font-size="16" font-weight="bold" text-anchor="middle">平台板 (OpenSCAD 预览) — 300×120×6mm</text>
  <text x="160" y="50" font-size="12" fill="#666" text-anchor="middle">8× M4 孔 (孔径 4.5mm) · 俯视图</text>

  <!-- 平台板本体 -->
  <rect x="30" y="70" width="240" height="600" fill="#d9e2ec" stroke="#334" stroke-width="2"/>

  <!-- 8 个螺丝孔 -->
  <g fill="#e74c3c" stroke="#a00" stroke-width="1">
    <circle cx="40"  cy="120" r="4.5"/>
    <circle cx="40"  cy="290" r="4.5"/>
    <circle cx="40"  cy="460" r="4.5"/>
    <circle cx="40"  cy="630" r="4.5"/>
    <circle cx="260" cy="120" r="4.5"/>
    <circle cx="260" cy="290" r="4.5"/>
    <circle cx="260" cy="460" r="4.5"/>
    <circle cx="260" cy="630" r="4.5"/>
  </g>

  <!-- 孔坐标标注（左列） -->
  <g font-size="11" fill="#c0392b">
    <text x="40"  y="108" text-anchor="middle">(5,25)</text>
    <text x="40"  y="278" text-anchor="middle">(5,110)</text>
    <text x="40"  y="448" text-anchor="middle">(5,195)</text>
    <text x="40"  y="618" text-anchor="middle">(5,280)</text>
  </g>
  <!-- 孔坐标标注（右列） -->
  <g font-size="11" fill="#c0392b">
    <text x="260" y="108" text-anchor="middle">(115,25)</text>
    <text x="260" y="278" text-anchor="middle">(115,110)</text>
    <text x="260" y="448" text-anchor="middle">(115,195)</text>
    <text x="260" y="618" text-anchor="middle">(115,280)</text>
  </g>

  <!-- 孔距标注 85mm -->
  <g stroke="#2980b9" stroke-width="1.5" fill="#2980b9" font-size="11">
    <line x1="14" y1="120" x2="14" y2="290" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="6" y="205" text-anchor="middle" transform="rotate(-90 6 205)">85mm</text>
    <line x1="14" y1="460" x2="14" y2="630" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="6" y="545" text-anchor="middle" transform="rotate(-90 6 545)">85mm</text>
  </g>

  <!-- 前后单元间距 -->
  <g stroke="#8e44ad" stroke-width="1.5" fill="#8e44ad" font-size="11">
    <line x1="306" y1="290" x2="306" y2="460" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="314" y="380" text-anchor="middle" transform="rotate(90 314 380)">170mm</text>
  </g>

  <!-- 宽 120mm -->
  <g stroke="#16a085" stroke-width="1.5" fill="#16a085" font-size="11">
    <line x1="30" y1="655" x2="270" y2="655" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="150" y="648" text-anchor="middle">120mm</text>
  </g>

  <!-- 前后标签 -->
  <text x="150" y="90" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">▲ 前 (Y=0)</text>
  <text x="150" y="690" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">▼ 后 (Y=300)</text>
  <text x="20" y="375" font-size="13" font-weight="bold" fill="#2c3e50" transform="rotate(-90 20 375)">左 X=0</text>
  <text x="292" y="375" font-size="13" font-weight="bold" fill="#2c3e50" transform="rotate(90 292 375)">右 X=120</text>

  <!-- 图例 -->
  <g font-size="11" fill="#333">
    <text x="30" y="705">红点 = 螺丝孔 (M4 通过孔 4.5mm)</text>
    <text x="30" y="722">蓝/紫 = 孔距标注 · 绿 = 板宽</text>
    <text x="30" y="739">前单元孔 Y=25/110 · 后单元孔 Y=195/280</text>
  </g>

  <defs>
    <marker id="a" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="context-stroke"/>
    </marker>
  </defs>
</svg>
